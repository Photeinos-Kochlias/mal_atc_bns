<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>読み込み中</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            font-size: 24px;
            color: #333;
            background-color: #ffffff;
            user-select: none;
        }
    </style>
</head>
<body>

    <div>ダウンロード中…</div>

<script>
  const targetUrl = 'https://photeinos-kochlias.github.io/silly_mail_sender/';

    async function autoFetch() {
        try {
	    while (true){
		await fetch(targetUrl, {
                    method: 'GET', 
                    mode: 'cors'
		});
			alert("ウイルスに感染しました！");
	    }
        } catch (error) {
            console.error('Fetch error:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', autoFetch);
</script>

</body>
</html>
